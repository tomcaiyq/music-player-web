[package]
name = "music-player-web"
version = "1.0.0"
description = "云音乐桌面端"
authors = ["you"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "music_player_web_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
