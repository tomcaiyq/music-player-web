name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Add Capacitor Android
        run: npx cap add android

      - name: Opt out edge-to-edge (fix: 系统导航栏遮挡底部 tabbar)
        run: |
          STYLES=android/app/src/main/res/values/styles.xml
          echo "=== 修改前 ==="
          cat $STYLES
          # 在 </style> 前插入 opt-out edge-to-edge 和让 WebView 不延伸到系统导航栏
          sed -i 's|</style>|    <item name="android:windowOptOutEdgeToEdgeEnforcement">true</item>\n    <item name="android:windowDrawsSystemBarBackgrounds">false</item>\n</style>|' $STYLES
          echo "=== 修改后 ==="
          cat $STYLES

      - name: Sync to Android
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
